<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Ships - World Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#0b1220; --panel:#111a2e; --line:#1e2b47; --txt:#e5ecf7; --dim:#8aa0c2; --acc:#38bdf8; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  .topbar { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1000; display:flex; gap:10px; align-items:center; background:rgba(17,26,46,.92); border:1px solid var(--line); border-radius:12px; padding:8px 14px; backdrop-filter: blur(6px); max-width:96vw; flex-wrap:wrap; justify-content:center; }
  .brand { font-weight:700; letter-spacing:.3px; white-space:nowrap; }
  .brand span { color:var(--acc); }
  .stat { color:var(--dim); white-space:nowrap; font-size:12.5px; }
  .stat b { color:var(--txt); font-size:13.5px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px; background:#64748b; }
  .dot.live { background:#22c55e; box-shadow:0 0 6px #22c55e; }
  .dot.down { background:#ef4444; }
  .panel { position:absolute; z-index:1000; top:64px; left:10px; background:rgba(17,26,46,.94); border:1px solid var(--line); border-radius:12px; padding:10px; width:250px; max-height:calc(100vh - 90px); overflow:auto; }
  .panel h3 { margin:2px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); }
  .views { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
  .views button, .fbtn { background:#0d1626; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:5px 9px; cursor:pointer; font-size:12.5px; }
  .views button:hover, .fbtn:hover { border-color:var(--acc); }
  .fbtn.on { background:#173053; border-color:var(--acc); color:#fff; }
  .filters { display:flex; flex-wrap:wrap; gap:6px; }
  .search { margin-top:12px; }
  .search input { width:100%; background:#0d1626; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; outline:none; }
  .search input:focus { border-color:var(--acc); }
  .results { margin-top:8px; }
  .rrow { padding:7px 8px; border-radius:8px; cursor:pointer; display:flex; justify-content:space-between; gap:6px; }
  .rrow:hover { background:#173053; }
  .rrow small { color:var(--dim); }
  .legend { position:absolute; bottom:12px; left:10px; z-index:1000; background:rgba(17,26,46,.9); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; color:var(--dim); }
  .legend i { width:10px; height:10px; border-radius:50%; display:inline-block; margin:0 5px 0 8px; }
  .hint { position:absolute; bottom:12px; right:10px; z-index:1000; background:rgba(17,26,46,.85); border:1px solid var(--line); border-radius:10px; padding:6px 10px; font-size:11.5px; color:var(--dim); max-width:300px; }
  .leaflet-popup-content-wrapper { background:var(--panel); color:var(--txt); border-radius:10px; }
  .leaflet-popup-tip { background:var(--panel); }
  .leaflet-popup-content b { color:var(--acc); }
  .pv { color:var(--dim); }
  @media (max-width:640px){ .panel { width:210px; top:auto; bottom:52px; max-height:46vh; } .legend{ display:none; } }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">⛵ Live<span>Ships</span> World Tracker</div>
  <div class="stat"><span class="dot" id="feedDot"></span><span id="feedTxt">connecting</span></div>
  <div class="stat">vessels <b id="stVessels">0</b></div>
  <div class="stat">live now <b id="stLive">0</b></div>
  <div class="stat">feed <b id="stMsg">0</b>/s</div>
</div>

<div class="panel">
  <h3>View</h3>
  <div class="views">
    <button id="vEgypt">Egypt &amp; Med</button>
    <button id="vSuez">Suez Canal</button>
    <button id="vWorld">World</button>
  </div>
  <h3>Filter</h3>
  <div class="filters" id="filters">
    <button class="fbtn on" data-f="all">All</button>
    <button class="fbtn" data-f="cargo">Cargo / Bulk</button>
    <button class="fbtn" data-f="tanker">Tankers</button>
    <button class="fbtn" data-f="passenger">Passenger</button>
    <button class="fbtn" data-f="fishing">Fishing</button>
    <button class="fbtn" data-f="tug">Tugs / Port</button>
    <button class="fbtn" data-f="egypt">To Egypt 🇪🇬</button>
  </div>
  <div class="search">
    <input id="q" type="text" placeholder="Search ship name or MMSI..." autocomplete="off">
    <div class="results" id="results"></div>
  </div>
</div>

<div class="legend" id="legend">
  <i style="background:#4ade80"></i>Cargo/Bulk
  <i style="background:#f87171"></i>Tanker
  <i style="background:#60a5fa"></i>Passenger
  <i style="background:#facc15"></i>Fishing
  <i style="background:#c084fc"></i>Tug/Port
  <i style="background:#94a3b8"></i>Other
</div>
<div class="hint">Free live AIS (terrestrial). Positions build up as ships report - the tracker remembers every vessel it sees. Zoom in for full detail.</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { preferCanvas: true, worldCopyJump: true, minZoom: 2 }).setView([30.5, 32.0], 7);
L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Esri, GEBCO, Garmin, NOAA &copy; OpenStreetMap | AIS: aisstream.io', maxZoom: 16
}).addTo(map);

const EGYPT_PORTS = [
  ['Alexandria', 31.20, 29.90], ['El Dekheila', 31.13, 29.80],
  ['Damietta', 31.44, 31.78], ['Port Said', 31.28, 32.30],
  ['Suez', 29.95, 32.55], ['Ain Sokhna', 29.60, 32.32],
  ['Abu Qir', 31.33, 30.07], ['Safaga', 26.74, 33.94]
];
for (const [name, la, lo] of EGYPT_PORTS) {
  L.circleMarker([la, lo], { radius: 5, color: '#f59e0b', weight: 2, fillColor: '#0b1220', fillOpacity: .9 })
    .addTo(map).bindTooltip('⚓ ' + name, { permanent: true, direction: 'right', className: 'portlbl', offset: [6, 0] });
}

// ---------- state ----------
const ships = new Map();        // mmsi -> {data, marker}
const layer = L.layerGroup().addTo(map);
let filter = 'all';
const COLOR = t => t >= 70 && t < 80 ? '#4ade80' : t >= 80 && t < 90 ? '#f87171'
  : t >= 60 && t < 70 ? '#60a5fa' : t == 30 ? '#facc15'
  : (t == 31 || t == 32 || t == 52 || t == 50 || t == 51) ? '#c084fc' : '#94a3b8';
const EG_RE = /(^|\b)(EG\s?|EGYPT|ALEXANDRIA|DAMIETTA|DAMIETA|PORT\s?SAID|P\.?\s?SAID|SUEZ|DEKHEILA|EL\s?DEKHEILA|ABU\s?QIR|ABU\s?KIR|SOKHNA|SAFAGA|ALX|EGPSD|EGALY|EGDAM|EGSUZ)/i;

function catMatch(v) {
  const t = v[5] || 0;
  switch (filter) {
    case 'all': return true;
    case 'cargo': return t >= 70 && t < 80;
    case 'tanker': return t >= 80 && t < 90;
    case 'passenger': return t >= 60 && t < 70;
    case 'fishing': return t == 30;
    case 'tug': return t == 31 || t == 32 || t == 50 || t == 51 || t == 52;
    case 'egypt': return EG_RE.test(v[7] || '');
  }
  return true;
}

function ensureMarker(v) {
  const mmsi = v[0];
  let s = ships.get(mmsi);
  if (!s) {
    const mk = L.circleMarker([v[1], v[2]], {
      radius: 4, weight: 1, color: 'rgba(0,0,0,.5)', fillColor: COLOR(v[5]), fillOpacity: .95
    });
    mk.on('click', () => showPopup(mmsi, v));
    s = { marker: mk, shown: false };
    ships.set(mmsi, s);
  }
  return s;
}

function render(v) {
  const s = ensureMarker(v);
  s.marker.setLatLng([v[1], v[2]]);
  s.marker.setStyle({ fillColor: COLOR(v[5]) });
  const ok = catMatch(v);
  if (ok && !s.shown) { s.marker.addTo(layer); s.shown = true; }
  if (!ok && s.shown) { layer.removeLayer(s.marker); s.shown = false; }
}

function ago(ts) {
  if (!ts) return 'no recent position';
  const m = Math.max(0, Math.round((Date.now() - ts) / 60000));
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  return h < 48 ? h + ' h ago' : Math.round(h / 24) + ' d ago';
}

function showPopup(mmsi, v) {
  v = v || (ships.get(mmsi) && ships.get(mmsi).v);
  if (!v) return;
  const html = `<b>${v[6] || 'Unknown vessel'}</b><br>
    <span class="pv">MMSI:</span> ${v[0]}<br>
    <span class="pv">Speed:</span> ${v[3] != null ? v[3].toFixed(1) + ' kn' : '-'} &nbsp; <span class="pv">Course:</span> ${v[4] != null ? Math.round(v[4]) + '°' : '-'}<br>
    ${v[7] ? `<span class="pv">Destination:</span> ${v[7]}<br>` : ''}
    <span class="pv">Updated:</span> ${ago(v[9])}`;
  L.popup().setLatLng([v[1], v[2]]).setContent(html).openOn(map);
}

function upsert(arr) {
  for (const v of arr) {
    const s = ensureMarker(v);
    s.v = v;
    render(v);
    ships.get(v[0]).v = v;
  }
}

// ---------- data feed ----------
let ws, viewTimer;
function sendView() {
  if (!ws || ws.readyState !== 1) return;
  const b = map.getBounds();
  ws.send(JSON.stringify({ type: 'view', bbox: [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()] }));
}
function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => { setFeed(true); sendView(); };
  ws.onclose = () => { setFeed(false); setTimeout(connect, 3000); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'snapshot') {
      for (const [, s] of ships) { if (s.shown) { layer.removeLayer(s.marker); s.shown = false; } }
      ships.clear();
      upsert(m.vessels);
      if (m.capped) flashHint('View capped at ' + m.vessels.length.toLocaleString() + ' vessels - zoom in for full detail.');
    } else if (m.type === 'delta') upsert(m.ups);
    else if (m.type === 'stats') {
      document.getElementById('stVessels').textContent = m.vessels.toLocaleString();
      document.getElementById('stLive').textContent = m.live.toLocaleString();
      document.getElementById('stMsg').textContent = m.msgPerSec;
      setFeed(m.upstream === 'live');
    }
  };
}
function setFeed(live) {
  const d = document.getElementById('feedDot');
  d.className = 'dot ' + (live ? 'live' : 'down');
  document.getElementById('feedTxt').textContent = live ? 'live feed' : 'reconnecting';
}
function flashHint(t) { document.querySelector('.hint').textContent = t; }
map.on('moveend', () => { clearTimeout(viewTimer); viewTimer = setTimeout(sendView, 400); });

// ---------- UI ----------
document.getElementById('vEgypt').onclick = () => map.setView([29.5, 31.0], 7);
document.getElementById('vSuez').onclick = () => map.setView([30.4, 32.35], 9);
document.getElementById('vWorld').onclick = () => map.setView([25, 10], 3);
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('.fbtn'); if (!b) return;
  document.querySelectorAll('.fbtn').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  filter = b.dataset.f;
  for (const [, s] of ships) if (s.v) render(s.v);
});

let qTimer;
document.getElementById('q').addEventListener('input', (e) => {
  clearTimeout(qTimer);
  const q = e.target.value.trim();
  if (q.length < 2) { document.getElementById('results').innerHTML = ''; return; }
  qTimer = setTimeout(async () => {
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q));
      const rows = await r.json();
      document.getElementById('results').innerHTML = rows.map(x =>
        `<div class="rrow" data-m="${x.mmsi}"><span>${x.name || 'Unnamed'}</span><small>${x.mmsi}</small></div>`).join('')
        || '<div class="rrow"><small>No match yet - the tracker only knows ships it has seen.</small></div>';
    } catch {}
  }, 300);
});
document.getElementById('results').addEventListener('click', (e) => {
  const row = e.target.closest('.rrow'); if (!row || !row.dataset.m) return;
  const s = ships.get(row.dataset.m);
  if (s && s.v) { map.setView([s.v[1], s.v[2]], 11); showPopup(row.dataset.m, s.v); }
  else {
    // ship known to server but outside current view - fetch and fly
    fetch('/api/search?q=' + row.dataset.m).then(r => r.json()).then(rows => {
      if (rows[0]) { map.setView([rows[0].lat, rows[0].lon], 11); }
    });
  }
});

connect();
</script>
</body>
</html>
